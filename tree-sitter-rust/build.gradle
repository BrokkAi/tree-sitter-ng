tasks.named('downloadSource') {
    url = "https://github.com/tree-sitter/tree-sitter-rust/archive/refs/tags/v${upstreamVersion}.zip"
}

tasks.named("buildNative") {
    def newSrcDir = downloadDir.dir("tree-sitter-rust-$upstreamVersion/src")
    additionalCFiles = newSrcDir.asFileTree.matching {
        include("**/*.c")
    }
    additionalIncludeDirs = project.files(newSrcDir)
}