tasks.named('downloadSource') {
    url = "https://github.com/tree-sitter/tree-sitter-typescript/archive/refs/tags/v${upstreamVersion}.zip"
}
tasks.named("buildNative") {
    def newSrcDir = downloadDir.dir("tree-sitter-typescript-${upstreamVersion}/tsx/src")
    additionalCFiles = newSrcDir.asFileTree.matching {
        include("**/*.c")
    }
    additionalIncludeDirs = project.files(newSrcDir)
}