tasks.named('downloadSource') {
    url = "https://github.com/tree-sitter/tree-sitter-scala/archive/refs/tags/v${upstreamVersion}.zip"
}

tasks.named("buildNative") {
    def newSrcDir = downloadDir.dir("tree-sitter-scala-${upstreamVersion}/src")
    additionalCFiles = newSrcDir.asFileTree.matching {
        include("**/*.c")
    }
    additionalIncludeDirs = project.files(newSrcDir)
}

dependencies {
    implementation project(":tree-sitter")
}

test{
    useJUnitPlatform()
    dependsOn downloadSource
}