name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'

      - name: Cache tools directory
        uses: actions/cache@v4
        with:
          path: tools
          key: ${{ runner.os }}-tools-${{ hashFiles('gradle.properties') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.1

      - name: Build and Zip Jars
        run: |
          TAG=${{ github.event.inputs.tag_name }}
          VERSION=${TAG#v}
          ./gradlew build zipReleaseJars -PlibVersion=$VERSION --stacktrace

      - name: Generate checksums
        shell: bash
        run: |
          cd build/distributions
          sha256sum tree-sitter-ng-jar.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.tag_name }}
          files: |
            build/distributions/tree-sitter-ng-jar.zip
            build/distributions/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
