name: "Cross Platform Quality & Unit Tests"

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**/README.md"
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**/README.md"
jobs:
  formatting:
    name: Formatting and Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run Spotless and Error Prone
        run: ./gradlew spotlessCheck analyze --stacktrace

  test:
    name: Test on ${{ matrix.os }}
    needs: formatting
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'
      - name: Cache tools directory
        uses: actions/cache@v4
        with:
          path: tools
          key: ${{ runner.os }}-tools-${{ hashFiles('gradle.properties') }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.2.1
        with:
          cache-read-only: true
      - name: Test with Gradle
        run: ./gradlew test --stacktrace
