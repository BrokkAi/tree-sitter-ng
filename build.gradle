
import org.treesitter.build.GenTask
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse

plugins {
    alias(libs.plugins.download)
    alias(libs.plugins.errorprone) apply false
    id 'com.diffplug.spotless' version '6.25.0' apply false
    id 'base'
}

allprojects {
    group = 'ai.brokk'
    repositories {
        mavenCentral()
    }
    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.compilerArgs << "-Werror"
    }
}


subprojects {
    version = project.findProperty('libVersion') ?: '0.1.0'

    apply plugin: 'java'
    apply plugin: 'signing'
    apply plugin: 'maven-publish'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'net.ltgt.errorprone'

    spotless {
        java {
            target("src/**/*.java")
            targetExclude("**/build/**", "**/test/resources/**", "**/generated/**")
            palantirJavaFormat(libs.versions.palantirJavaFormat.get())
            removeUnusedImports()
        }
    }

    tasks.register("tidy") {
        group = "formatting"
        description = "Runs Spotless formatting"
        dependsOn("spotlessApply")
    }

    tasks.register("analyze") {
        group = "verification"
        description = "Run errorprone checks"
        dependsOn("compileJava", "compileTestJava")
    }

    tasks.register("fix") {
        group = "formatting"
        description = "Run errorprone auto-patching"
        dependsOn("compileJava", "compileTestJava")
    }

    tasks.register("verifyPackageInfo") {
        group = "verification"
        description = "Ensures every package with Java files has a package-info.java"
        doLast {
            def sourceSets = project.extensions.getByType(SourceSetContainer)
            sourceSets.main.java.srcDirs.each { srcDir ->
                if (!srcDir.exists()) return
                srcDir.eachDirRecurse { dir ->
                    def javaFiles = dir.listFiles({ file -> file.name.endsWith(".java") && file.name != "package-info.java" } as FileFilter)
                    if (javaFiles && !new File(dir, "package-info.java").exists()) {
                        def pkg = srcDir.relativePath(dir).replace(File.separator, ".")
                        throw new GradleException("Missing package-info.java in package: ${pkg} (at ${dir.absolutePath}). " +
                                "Please create it and add @org.jspecify.annotations.NullMarked.")
                    }
                }
            }
        }
    }

    tasks.named("check") {
        dependsOn("tidy")
        dependsOn("verifyPackageInfo")
        dependsOn("analyze")
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        compileOnly libs.jspecify
        errorprone(libs.errorprone.core)
        errorprone(libs.nullaway)

        testImplementation platform(libs.junit.bom)
        testImplementation 'org.junit.jupiter:junit-jupiter'
        if(project.name != 'tree-sitter'){
            testImplementation project(":tree-sitter-tests")
            implementation project(":tree-sitter")
        }
    }

    tasks.withType(JavaCompile).configureEach {
        def isFix = gradle.startParameter.taskNames.contains("fix")
        options.errorprone {
            if (isFix) {
                errorproneArgs.addAll(
                    "-XepPatchChecks:UnnecessarilyFullyQualified,MissingOverride,RemoveUnusedImports,RedundantNullCheck,RedundantThrows,OperatorPrecedence,UnnecessaryParentheses,EmptyBlockTag,ClassCanBeStatic",
                    "-XepPatchLocation:IN_PLACE"
                )
            }

            disable("FutureReturnValueIgnored")
            disable("MissingSummary")
            disable("NonCanonicalType")

            excludedPaths = ".*/src/main/java/(dev/|eu/|org/treesitter/tests/).*"

            error("NullAway")
            warn("UnnecessarilyFullyQualified")
            warn("EmptyBlockTag")

            option("NullAway:AnnotatedPackages", "org.treesitter")
            option("NullAway:ExcludedPackages", "org.treesitter.tests")
            option("NullAway:ExcludedFieldAnnotations",
                   "org.junit.jupiter.api.BeforeEach,org.junit.jupiter.api.BeforeAll,org.junit.jupiter.api.Test")
            option("NullAway:ExcludedClassAnnotations",
                   "org.junit.jupiter.api.extension.ExtendWith,org.junit.jupiter.api.TestInstance")
            option("NullAway:AcknowledgeRestrictiveAnnotations", "true")
            option("NullAway:CheckOptionalEmptiness", "true")
            option("NullAway:KnownInitializers",
                   "org.junit.jupiter.api.BeforeEach,org.junit.jupiter.api.BeforeAll")
            option("NullAway:HandleTestAssertionLibraries", "true")
            option("NullAway:ExcludedPaths", ".*/(dev/|tree-sitter-tests/).*")
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
                pom {
                    name = project.name
                    url = 'https://github.com/brokk-ai/tree-sitter-ng'
                    description = "Next generation Tree Sitter Java binding"
                    licenses {
                        license {
                            name = 'MIT'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/brokk-ai/tree-sitter-ng.git'
                        developerConnection = 'scm:git:https://github.com/brokk-ai/tree-sitter-ng.git'
                        url = 'https://github.com/brokk-ai/tree-sitter-ng'
                    }
                    developers {
                        developer {
                            id = 'bonede'
                            name = 'Wang Liang'
                            email = 'bonede@qq.com'
                        }
                    }
                }
            }
        }
    }

    signing {
        if (project.hasProperty('signing.keyId')) {
            sign configurations.archives
            sign publishing.publications
        }
    }

    java {
        withJavadocJar()
        withSourcesJar()
    }

    test {
        useJUnitPlatform()
        mustRunAfter("spotlessCheck")

        // Test execution settings
        testLogging {
            events("passed", "skipped") // Only show passed/skipped during execution
            exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
            showExceptions = false
            showCauses = false
            showStackTraces = false
            showStandardStreams = false
        }

        // Collect failed tests and their output for end summary
        def failedTests = []
        def testOutputs = [:]

        // Helper function to format exception with full cause chain
        def formatExceptionWithCauses = { Throwable e ->
            if (e == null) return "Unknown error"
            StringBuilder sb = new StringBuilder()
            Throwable current = e
            boolean isFirst = true
            while (current != null) {
                if (!isFirst) {
                    sb.append("\n   Caused by: ")
                } else {
                    isFirst = false
                }
                sb.append(current.message ?: current.getClass().getName())
                sb.append("\n")
                current.stackTrace.each { frame ->
                    sb.append("      at $frame\n")
                }
                current = current.cause
            }
            return sb.toString().trim()
        }

        // Capture test output for failed tests
        addTestOutputListener(new TestOutputListener() {
            @Override
            void onOutput(TestDescriptor testDescriptor, TestOutputEvent outputEvent) {
                def testKey = "${testDescriptor.className}.${testDescriptor.name}"
                if (outputEvent.destination == TestOutputEvent.Destination.StdOut ||
                    outputEvent.destination == TestOutputEvent.Destination.StdErr) {
                    testOutputs[testKey] = (testOutputs[testKey] ?: "") + outputEvent.message
                }
            }
        })

        // Capture individual test failures for later reporting
        afterTest { desc, result ->
            if (result.resultType == TestResult.ResultType.FAILURE) {
                def testKey = "${desc.className}.${desc.name}"
                def exceptionDetails = formatExceptionWithCauses(result.exception)
                def output = testOutputs[testKey] ? "\n   Output:\n${testOutputs[testKey]}" : ""
                failedTests << "❌ $testKey\n   $exceptionDetails$output"
            }
        }

        // Show all failures grouped at the end
        afterSuite { desc, result ->
            if (desc.parent == null) { // Only execute once for the root suite
                if (result.failedTestCount > 0) {
                    println "\n" + "=".repeat(80)
                    println "FAILED TESTS SUMMARY"
                    println "=".repeat(80)
                    failedTests.each { failure ->
                        println "\n$failure"
                    }
                    println "\n" + "=".repeat(80)
                    println "Total tests: ${result.testCount}"
                    println "Passed: ${result.successfulTestCount}"
                    println "Failed: ${result.failedTestCount}"
                    println "Skipped: ${result.skippedTestCount}"
                    println "=".repeat(80)
                }
            }
        }
    }

    tasks.withType(ProcessResources).configureEach {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    if (project.name != 'tree-sitter' && project.name != 'tree-sitter-demo' && project.name != 'tree-sitter-tests') {
        def downloadSource = tasks.register('downloadSource', DownloadSourceTask)

        tasks.named('test') {
            dependsOn downloadSource
        }

        def buildNative = tasks.register('buildNative', BuildNativeTask) {
            zigExe = rootProject.downloadZig.zigExe
            dependsOn downloadSource, rootProject.downloadZig
        }

        sourceSets.main.resources {
            srcDir(buildNative.map { it.jniOutDir })
        }
    } else if (project.name == 'tree-sitter') {
        // tree-sitter core also needs to build its native part
        def downloadSource = tasks.register('downloadSource', DownloadSourceTask)

        def buildNative = tasks.register('buildNative', BuildNativeTask) {
            zigExe = rootProject.downloadZig.zigExe
            dependsOn downloadSource, rootProject.downloadZig
        }

        sourceSets.main.resources {
            srcDir(buildNative.map { it.jniOutDir })
        }
    }

    tasks.withType(Javadoc).configureEach {
        options.locale = 'en_US'
        options.JFlags = ["-Duser.language=en_US"]
        if (JavaVersion.current().isJava8Compatible()) {
            options.addStringOption('Xdoclint:all,-missing', '-quiet')
        }
    }
}


tasks.register('downloadMiniSign', DownloadMiniSignTask)

tasks.register('downloadZig', DownloadZigTask){
    miniSignExe = downloadMiniSign.miniSignExe
    dependsOn downloadMiniSign
}

tasks.register("compile") {
    group = "build"
    description = "Compile Java and build native modules for all subprojects"
    subprojects.forEach { sub ->
        dependsOn(sub.tasks.named("compileJava"))
        sub.tasks.matching { it.name == "buildNative" }.all { t ->
            dependsOn(t)
        }
    }
}

tasks.register("gen", GenTask) {
    group = "build setup"
    description = "Generate sub project for tree sitter parser"
}

tasks.register("zipReleaseJars", Zip) {
    group = "build"
    description = "Bundles all subproject jars (classes, sources, and javadoc) into a single zip file."
    archiveFileName = "tree-sitter-ng-jar.zip"
    destinationDirectory = layout.buildDirectory.dir("distributions")

    subprojects.forEach { sub ->
        sub.plugins.withType(JavaPlugin) {
            from(sub.tasks.named("jar")) { into(sub.name) }
            from(sub.tasks.named("sourcesJar")) { into(sub.name) }
            from(sub.tasks.named("javadocJar")) { into(sub.name) }
        }
    }
}
