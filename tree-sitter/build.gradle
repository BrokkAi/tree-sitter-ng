dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation project(':tree-sitter-json')
}

tasks.named('downloadSource') {
    url = "https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v${upstreamVersion}.zip"
}

tasks.named('buildNative') {
    def newSrcDir = downloadDir.dir("tree-sitter-$upstreamVersion")
    additionalCFiles = newSrcDir.files("lib/src/lib.c")
    additionalIncludeDirs = project.files(
        newSrcDir.dir("lib/src"),
        newSrcDir.dir("lib/include")
    )
}